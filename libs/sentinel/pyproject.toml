[project]
name = "hapm-sentinel"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hapm-config",
  "hapm-codeintel",
  "hapm-core",
  "hapm-mcp-client",
  "temporalio>=1.9",
  "pydantic>=2.10",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.36",
  "httpx>=0.28",
  "typer>=0.15",
]

[project.scripts]
sentinel = "hapm_sentinel.cli:app"

[tool.uv.sources]
hapm-config = { workspace = true }
hapm-codeintel = { workspace = true }
hapm-core = { workspace = true }
hapm-mcp-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapm_sentinel"]
