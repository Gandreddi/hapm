[project]
name = "hapm-mcp-client"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hapm-core",
  "mcp>=1.12,<2",
  "jsonschema>=4.23",
  "pyyaml>=6.0.2",
]

[tool.uv.sources]
hapm-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapm_mcp_client"]
