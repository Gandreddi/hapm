[project]
name = "hapm-memory"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hapm-core",
  "httpx>=0.28",
  "pgvector>=0.3.6",
]

[tool.uv.sources]
hapm-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapm_memory"]
