[project]
name = "hapm-github"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hapm-core",
  "hapm-config",
  "hapm-mcp-client",
  "hapm-codeintel",
  "mcp>=1.12,<2",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
]

[tool.uv.sources]
hapm-core = { workspace = true }
hapm-config = { workspace = true }
hapm-mcp-client = { workspace = true }
hapm-codeintel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapm_github"]
