[project]
name = "hapm-sentinel-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hapm-config",
  "hapm-core",
  "hapm-mcp-client",
  "hapm-sentinel",
  "hapm-telemetry",
]

[tool.uv.sources]
hapm-config = { workspace = true }
hapm-core = { workspace = true }
hapm-mcp-client = { workspace = true }
hapm-sentinel = { workspace = true }
hapm-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapm_sentinel_mcp"]
