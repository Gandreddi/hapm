[project]
name = "hapm-developer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hapm-core",
  "hapm-config",
  "hapm-codeintel",
  "hapm-memory",
  "httpx>=0.28",
  "pyyaml>=6.0.2",
]

[tool.uv.sources]
hapm-core = { workspace = true }
hapm-config = { workspace = true }
hapm-codeintel = { workspace = true }
hapm-memory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapm_developer"]
