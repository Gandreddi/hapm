[project]
name = "hapm-orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hapm-core",
  "hapm-memory",
  "hapm-mcp-client",
  "hapm-telemetry",
  "temporalio>=1.9",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0.10",
  "psycopg[binary,pool]>=3.2.3",
  "fastapi>=0.120",
  "uvicorn>=0.34",
  "pyyaml>=6.0.2",
]

[tool.uv.sources]
hapm-core = { workspace = true }
hapm-memory = { workspace = true }
hapm-mcp-client = { workspace = true }
hapm-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapm_orchestrator"]
