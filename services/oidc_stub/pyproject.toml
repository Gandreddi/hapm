[project]
name = "hapm-oidc-stub"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hapm-telemetry",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pyjwt[crypto]>=2.10",
  "pyyaml>=6.0.2",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
]

[tool.uv.sources]
hapm-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapm_oidc_stub"]
