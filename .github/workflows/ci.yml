name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: make check
      - name: Dependency audit (Python)
        # The export is fully pinned with hashes, so pip-audit checks it without re-resolving.
        run: |
          uv export --all-packages --no-dev --no-emit-workspace --format requirements-txt > requirements-audit.txt
          uvx pip-audit==2.7.3 --strict --progress-spinner off --no-deps --disable-pip -r requirements-audit.txt

  portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install -g pnpm@9.15.0
      - run: make portal-check
      - run: cd apps/portal && pnpm audit --prod --ignore-workspace

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: helm lint deploy/helm/hapm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=deploy/terraform init -backend=false
      - run: terraform -chdir=deploy/terraform validate
      - run: terraform -chdir=deploy/terraform fmt -check

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan of the full git history (pinned gitleaks, same as local)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact

  exit-demo:
    runs-on: ubuntu-24.04
    needs: [check, portal]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install -g pnpm@9.15.0
      - run: uv sync --all-packages
      - run: make up
      - name: Container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hapm-python:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - run: make demo
      - run: make verify
      - run: make coverage
      - run: cd apps/portal && pnpm install --frozen-lockfile --ignore-workspace && pnpm exec playwright install --with-deps chromium && pnpm exec playwright test
      - if: failure()
        run: make logs
      - if: always()
        run: make clean
