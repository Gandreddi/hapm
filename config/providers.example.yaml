# LLM providers, model aliases, prices and budgets for the gateway.
# Copy to config/providers.yaml (git-ignored) on the office laptop and fill in the references.
# Secrets are references (env:NAME or kv:NAME), never values.

# Set to the name or ticket of the office approval that allows sending repository and Jira
# content to the providers below. The Developer agent pilot refuses to run while this is empty.
data_approval: ""

providers:
  github-models:
    # Official GitHub Models API (OpenAI-compatible). Token: fine-grained PAT with models:read
    # issued from the office GitHub account. Never use Copilot IDE tokens or private endpoints.
    type: github_models
    endpoint: https://models.github.ai/inference
    token_ref: env:GITHUB_MODELS_TOKEN
  fake:
    type: fake
  fake-broken:
    type: fake
    always_fail: true
  azure-openai:
    type: azure_openai
    endpoint_ref: env:AZURE_OPENAI_ENDPOINT
    api_key_ref: env:AZURE_OPENAI_API_KEY
    api_version: "2024-10-21"
  anthropic:
    type: anthropic
    api_key_ref: env:ANTHROPIC_API_KEY

# Each alias lists targets in order; the next target is tried on a retryable error or timeout.
aliases:
  fast:
    timeout_seconds: 30
    targets:
      - { provider: fake, model: fake-fast }
  smart:
    timeout_seconds: 60
    targets:
      # Put the model id from your org's GitHub Models catalog first, for example:
      # - { provider: github-models, model: "<model id>" }
      - { provider: fake, model: fake-smart }
  judge:
    timeout_seconds: 60
    targets:
      - { provider: fake, model: fake-judge }
  embed:
    timeout_seconds: 30
    targets:
      - { provider: fake, model: fake-embed }
  fallback-demo:
    timeout_seconds: 30
    targets:
      - { provider: fake-broken, model: fake-broken }
      - { provider: fake, model: fake-fast }

# USD per 1,000 tokens.
prices:
  default: { prompt: 0.001, completion: 0.002 }
  fake-embed: { prompt: 0.0001, completion: 0.0 }

budgets:
  per_run: { tokens: 50000, cost_usd: 1.00 }
  per_team_daily: { tokens: 1000000, cost_usd: 20.00 }
  team_overrides:
    tiny-team:
      per_run: { tokens: 5, cost_usd: 0.0001 }
      per_team_daily: { tokens: 5, cost_usd: 0.0001 }

redaction:
  enabled: true
  patterns:
    email: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    api_key: "(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16})"
    bearer: "Bearer\\s+[A-Za-z0-9._-]{16,}"

retention:
  usage_days: 90
